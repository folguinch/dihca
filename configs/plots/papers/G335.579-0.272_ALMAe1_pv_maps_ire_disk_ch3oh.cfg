[DEFAULT]
ncols = 2
nrows = 3
sharex = true
sharey = true
styles = maps lipari_r aspect_auto
vertical_cbar = false
horizontal_cbar = false
#cbarlocs = (0,0)
left = 0.8
right = 0.15
top = 0.6
bottom = 0.6
vspace = 0.2
hspace = 0.2
cbar_spacing = 0.1
labelpad = 5
label_xpad = 0.45
label_ypad = -0.7
xunit = arcsec
yunit = km/s
xname = Offset
yname = Velocity
vmin = 0. mJy/beam
vmax = 25 mJy/beam
rms = 1.4 mJy/beam
# Units
unit = mJy/beam
nsigma = 3
contour_linewidth = 1
contour_colors = #7f7f7f
contour_stretch = log
xticks_fmt = {x:.1f}
yticks_fmt = {x:.0f}
inverty = true
# Artists
vlines = 0. arcsec, 0. arcsec
vlines_linestyle = :
vlines_color = #adacac
hlines = -46.5 km/s
hlines_linestyle = --
hlines_color = #adacac
ticks_color = k
# Non-standard
basedir = ../results/feria_fit/

[pvrot_rot]
loc = 0 0
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_270.fits
title = PV Rotation (PA=270$$^{\circ}$$)
label = PV$$_{\rm rot}$$
# Contours
self_contours = true

[pvrot_rot_out]
loc = 1 0
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_270.fits
label = PV$$_{\rm rot}$$ + PV$$_{\rm out}$$
# Contours
self_contours = true

[pvrot_all]
loc = 2 0
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_270.fits
label = PV + Max
# Contours
self_contours = true

[pvout_titled]
loc = 0 1
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_0.fits
#xlim = -0.35 0.35 arcsec
title = PV Outflow (PA=0$$^{\circ}$$)
#label = 
# Contours
self_contours = true

[pvout]
loc = 1 1, 2 1
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_0.fits
#xlim = -0.35 0.35 arcsec
#label = 
# Contours
self_contours = true

[model_pvrot_rot]
loc = 0 0
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_preliminary/cube_mass39.58_rcb1106.80_incl16.57_rout2125.45_lw6.17_ireflare90.85_pa308.96_dra37.78_ddec-32.72.regrid.pv_270.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 22.19 mJy -> 15.85 * 1.4mJy
# Model max 861.72 mJy -> 15.85 * 54.37mJy
rms = 54.37 mJy/beam

[model_pvrot_rot_out]
loc = 1 0
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout_preliminary/cube_mass34.36_rcb1106.95_incl11.39_rout2167.57_lw6.32_ireflare141.03_pa234.72_dra80.17_ddec-61.09.regrid.pv_270.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 22.19 mJy -> 15.85 * 1.4mJy
# Model max 634.30mJy -> 15.85 * 40.02mJy
rms = 40.02 mJy/beam

[model_pvrot_all]
loc = 2 0
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_all/cube_mass27.35_rcb998.12_incl5.87_rout2297.66_lw6.84_ireflare138.43_pa286.23_dra-18.38_ddec-58.57.regrid.pv_270.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 22.19 mJy -> 15.85 * 1.4mJy
# Model max 470.19 mJy -> 15.85 * 29.67mJy
rms = 29.67 mJy/beam

[model_pvout_rot_out]
loc = 1 1
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout_preliminary/cube_mass34.36_rcb1106.95_incl11.39_rout2167.57_lw6.32_ireflare141.03_pa234.72_dra80.17_ddec-61.09.regrid.pv_0.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 21.68 mJy -> 15.49 * 1.4mJy
# Model max 820.55 mJy -> 15.49 * 52.97mJy
rms = 52.97 mJy/beam

[model_pvout_all]
loc = 2 1
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_all/cube_mass27.35_rcb998.12_incl5.87_rout2297.66_lw6.84_ireflare138.43_pa286.23_dra-18.38_ddec-58.57.regrid.pv_0.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 21.68 mJy -> 15.49 * 1.4mJy
# Model max 813.94 mJy -> 15.49 * 52.55mJy
rms = 52.55 mJy/beam

