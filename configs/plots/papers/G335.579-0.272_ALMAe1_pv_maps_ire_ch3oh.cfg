[DEFAULT]
ncols = 2
nrows = 3
sharex = true
sharey = true
styles = maps lipari_r aspect_auto
vertical_cbar = false
horizontal_cbar = false
#cbarlocs = (0,0)
left = 0.8
right = 0.15
top = 0.6
bottom = 0.6
vspace = 0.2
hspace = 0.2
cbar_spacing = 0.1
labelpad = 5
label_xpad = 0.45
label_ypad = -0.7
xunit = arcsec
yunit = km/s
xname = Offset
yname = Velocity
vmin = 0. mJy/beam
vmax = 25 mJy/beam
rms = 1.4 mJy/beam
# Units
unit = mJy/beam
nsigma = 3
contour_linewidth = 1
contour_colors = #7f7f7f
contour_stretch = log
xticks_fmt = {x:.1f}
yticks_fmt = {x:.0f}
inverty = true
# Artists
vlines = 0. arcsec, 0. arcsec
vlines_linestyle = :
vlines_color = #adacac
hlines = -46.5 km/s
hlines_linestyle = --
hlines_color = #adacac
ticks_color = k
# Non-standard
basedir = ../results/feria_fit/

[pvrot_rot]
loc = 0 0
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_270.fits
title = PV Rotation (PA=270$$^{\circ}$$)
label = PV$$_{\rm rot}$$
# Contours
self_contours = true

[pvrot_rot_out]
loc = 1 0
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_270.fits
label = PV$$_{\rm rot}$$ + PV$$_{\rm out}$$
# Contours
self_contours = true

[pvrot_all]
loc = 2 0
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_270.fits
label = PV + Max
# Contours
self_contours = true

[pvout_titled]
loc = 0 1
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_0.fits
#xlim = -0.35 0.35 arcsec
title = PV Outflow (PA=0$$^{\circ}$$)
#label = 
# Contours
self_contours = true

[pvout]
loc = 1 1, 2 1
pvmap = ${basedir}/G335.579-0.272_ALMAe1_ire+disk_pvrot_pvout/almae1_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans40.recenter_vlsr.pv_0.fits
#xlim = -0.35 0.35 arcsec
#label = 
# Contours
self_contours = true

[model_pvrot_rot]
loc = 0 0
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire_pvrot/cube_mass36.67_rcb654.05_incl10.93_rout2127.22_lw5.76_ireflare87.92_pa294.39_dra4.26_ddec-10.52.regrid.pv_270.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 22.19 mJy -> 15.85 * 1.4mJy
# Model max 893.62 mJy -> 15.85 * 56.38mJy
rms = 56.38 mJy/beam

[model_pvrot_rot_out]
loc = 1 0
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire_pvrot_pvout/cube_mass15.36_rcb604.23_incl6.04_rout2229.49_lw4.76_ireflare142.53_pa279.52_dra-31.14_ddec-19.63.regrid.pv_270.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 22.19 mJy -> 15.85 * 1.4mJy
# Model max 938.27mJy -> 15.85 * 59.20mJy
rms = 59.20 mJy/beam

[model_pvrot_all]
loc = 2 0
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire_all/cube_mass27.75_rcb720.16_incl5.63_rout2256.47_lw6.03_ireflare104.16_pa279.54_dra-19.55_ddec-24.94.regrid.pv_270.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 22.19 mJy -> 15.85 * 1.4mJy
# Model max 945.40 mJy -> 15.85 * 59.65mJy
rms = 59.65 mJy/beam

[model_pvout_rot_out]
loc = 1 1
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire_pvrot_pvout/cube_mass15.36_rcb604.23_incl6.04_rout2229.49_lw4.76_ireflare142.53_pa279.52_dra-31.14_ddec-19.63.regrid.pv_0.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 21.68 mJy -> 15.49 * 1.4mJy
# Model max 949.38 mJy -> 15.49 * 61.29mJy
rms = 61.29 mJy/beam

[model_pvout_all]
loc = 2 1
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe1_ire_all/cube_mass27.75_rcb720.16_incl5.63_rout2256.47_lw6.03_ireflare104.16_pa279.54_dra-19.55_ddec-24.94.regrid.pv_0.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 21.68 mJy -> 15.49 * 1.4mJy
# Model max 958.09 mJy -> 15.49 * 61.85mJy
rms = 61.85 mJy/beam

