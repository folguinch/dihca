[DEFAULT]
ncols = 2
nrows = 3
sharex = true
sharey = true
styles = maps lipari_r aspect_auto
vertical_cbar = false
horizontal_cbar = false
#cbarlocs = (0,0)
left = 0.8
right = 0.15
top = 0.6
bottom = 0.6
vspace = 0.2
hspace = 0.2
cbar_spacing = 0.1
labelpad = 5
label_xpad = 0.45
label_ypad = -0.7
xunit = arcsec
yunit = km/s
xname = Offset
yname = Velocity
vmin = 0. mJy/beam
vmax = 20 mJy/beam
rms = 1.4 mJy/beam
# Units
unit = mJy/beam
nsigma = 3
contour_linewidth = 1
contour_colors = #7f7f7f
contour_stretch = log
xticks_fmt = {x:.1f}
yticks_fmt = {x:.0f}
inverty = true
# Artists
vlines = 0. arcsec, 0. arcsec
vlines_linestyle = :
vlines_color = #adacac
hlines = -48.8 km/s
hlines_linestyle = --
hlines_color = #adacac
ticks_color = k
# Non-standard
basedir = ../results/feria_fit/

[pvrot_rot]
loc = 0 0
pvmap = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_all/almae4_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans50.recenter_vlsr.pv_202.fits
title = PV Rotation (PA=202$$^{\circ}$$)
label = PV$$_{\rm rot}$$
# Contours
self_contours = true

[pvrot_rot_out]
loc = 1 0
pvmap = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_all/almae4_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans50.recenter_vlsr.pv_202.fits
label = PV$$_{\rm rot}$$ + PV$$_{\rm out}$$
# Contours
self_contours = true

[pvrot_all]
loc = 2 0
pvmap = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_all/almae4_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans50.recenter_vlsr.pv_202.fits
label = PV + Max
# Contours
self_contours = true

[pvout_titled]
loc = 0 1
pvmap = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_all/almae4_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans50.recenter_vlsr.pv_292.fits
xlim = -0.35 0.35 arcsec
title = PV Outflow (PA=292$$^{\circ}$$)
#label = 
# Contours
self_contours = true

[pvout]
loc = 1 1, 2 1
pvmap = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_all/almae4_CH3OH_18_3_15_-17_4_14_A_vt_0_nchans50.recenter_vlsr.pv_292.fits
xlim = -0.35 0.35 arcsec
#label = 
# Contours
self_contours = true

[model_pvrot_rot]
loc = 0 0
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_pvrot/cube_mass47.88_rcb365.24_incl-18.56_rout2801.80_lw4.27_ireflare90.01_pa168.07_dra12.13_ddec-17.16.regrid.pv_202.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 15.65 mJy -> 11.18 * 1.4mJy
# Model max 884.11 mJy -> 11.18 * 79.09mJy
rms = 79.09 mJy/beam

[model_pvrot_rot_out]
loc = 1 0
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_pvrot_pvout/cube_mass44.97_rcb383.99_incl-15.18_rout2852.19_lw4.44_ireflare77.73_pa168.31_dra4.72_ddec-22.42.regrid.pv_202.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 15.65 mJy -> 11.18 * 1.4mJy
# Model max 892.48 mJy -> 11.18 * 79.81mJy
rms = 79.81 mJy/beam

[model_pvrot_all]
loc = 2 0
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_all/cube_mass56.29_rcb378.11_incl-15.06_rout2766.77_lw4.17_ireflare68.38_pa169.03_dra17.20_ddec-46.25.regrid.pv_202.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 15.65 mJy -> 11.18 * 1.4mJy
# Model max 927.04 mJy -> 11.18 * 82.92mJy
rms = 82.92 mJy/beam

[model_pvout_rot_out]
loc = 1 1
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_pvrot_pvout/cube_mass44.97_rcb383.99_incl-15.18_rout2852.19_lw4.44_ireflare77.73_pa168.31_dra4.72_ddec-22.42.regrid.pv_292.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 17.26 mJy -> 12.33 * 1.4mJy
# Model max 921.48 mJy -> 12.33 * 74.73mJy
rms = 74.73 mJy/beam

[model_pvout_all]
loc = 2 1
pvmap_contour = ${basedir}/G335.579-0.272_ALMAe4_ire+disk_all/cube_mass56.29_rcb378.11_incl-15.06_rout2766.77_lw4.17_ireflare68.38_pa169.03_dra17.20_ddec-46.25.regrid.pv_292.fits
contour_colors = #0c99ff
contour_linewidth = 1
unit = mJy/beam
# Observed max is 17.26 mJy -> 12.33 * 1.4mJy
# Model max 911.18 mJy -> 12.33 * 73.9mJy
rms = 73.9 mJy/beam

